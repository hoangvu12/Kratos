name: PR 313 Unix terminal check
on:
  push:
    branches: [compatibility-terminal-313]
permissions:
  contents: read
jobs:
  terminals:
    if: github.repository == 'hoangvu12/comet'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native terminal lifecycle
        run: cargo test --locked -p zeron-engine --test m5_repos_diffs_terminals terminal_ -- --nocapture
