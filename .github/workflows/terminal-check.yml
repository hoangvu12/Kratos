name: PR 313 macOS baseline comparison
on:
  push:
    branches: [compatibility-terminal-313]
permissions:
  contents: read
jobs:
  terminals:
    if: github.repository == 'hoangvu12/comet'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: PR shared runtime tests
        run: cargo test --locked --no-fail-fast -p zeron-engine -p zeron-harness -p zeron-update --lib
      - uses: actions/checkout@v4
        if: always() && !cancelled()
        with:
          ref: 67466c7bd8dea4e11cdc4e55a7d05199acd5f8bd
          clean: false
      - name: Upstream shared runtime tests
        if: always() && !cancelled()
        run: cargo test --locked --no-fail-fast -p zeron-engine -p zeron-harness -p zeron-update --lib
